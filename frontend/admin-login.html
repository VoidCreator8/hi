<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ShopHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-login-page">
    <div class="admin-login-card">
      <h1>ShopHub</h1>
      <p>Admin Dashboard Login</p>

      <div class="login-error" id="login-error"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content:center;" id="login-btn">
          Sign In
        </button>
      </form>

      <p style="margin-top:1.5rem; font-size:0.75rem; color:var(--gray); text-align:center;">
        <a href="index.html" style="color:var(--primary);">&larr; Back to Store</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // If already logged in, redirect
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('admin_token');
      if (token) {
        try {
          await api.verifyToken();
          window.location.href = 'admin.html';
        } catch (err) {
          localStorage.removeItem('admin_token');
        }
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errorEl.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorEl.textContent = 'Please fill in all fields.';
        errorEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const data = await api.login({ username, password });
        localStorage.setItem('admin_token', data.token);
        window.location.href = 'admin.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed. Check your credentials.';
        errorEl.style.display = 'block';
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
