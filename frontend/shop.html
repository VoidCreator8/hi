<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - ShopHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        ShopHub
      </a>
      <button class="mobile-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">&#9776;</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="cart.html" class="cart-link">Cart <span class="cart-count" style="display:none">0</span></a></li>
        <li><a href="admin-login.html">Admin</a></li>
      </ul>
    </div>
  </nav>

  <!-- Shop Content -->
  <section class="products-section">
    <div class="container">
      <h2 class="section-title">All Products</h2>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <input type="text" class="search-input" id="search-input" placeholder="Search products...">
        <div class="category-chips" id="category-chips">
          <button class="category-chip active" data-category="">All</button>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="products-grid" id="products-grid">
        <p style="text-align:center; color: var(--gray); grid-column: 1/-1;">Loading products...</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 ShopHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script>
    let currentCategory = '';
    let searchTimeout = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // Check URL for category filter
      const params = new URLSearchParams(window.location.search);
      currentCategory = params.get('category') || '';

      await loadCategories();
      await loadProducts();

      // Search handler
      document.getElementById('search-input').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadProducts(), 300);
      });
    });

    async function loadCategories() {
      try {
        const categories = await api.getCategories();
        const chips = document.getElementById('category-chips');
        chips.innerHTML = `
          <button class="category-chip ${!currentCategory ? 'active' : ''}" data-category="" onclick="filterByCategory('')">All</button>
          ${categories.map(c => `
            <button class="category-chip ${currentCategory == c.id ? 'active' : ''}" data-category="${c.id}" onclick="filterByCategory('${c.id}')">
              ${escapeHtml(c.name)}
            </button>
          `).join('')}
        `;
      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    }

    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      const search = document.getElementById('search-input').value;

      const params = {};
      if (currentCategory) params.category = currentCategory;
      if (search) params.search = search;

      try {
        const products = await api.getProducts(params);
        if (products.length === 0) {
          grid.innerHTML = '<p style="text-align:center; color: var(--gray); grid-column: 1/-1; padding: 2rem;">No products found.</p>';
          return;
        }
        grid.innerHTML = products.map(p => createProductCard(p)).join('');
      } catch (err) {
        grid.innerHTML = '<p style="text-align:center; color: var(--gray); grid-column: 1/-1;">Failed to load products.</p>';
      }
    }

    function filterByCategory(categoryId) {
      currentCategory = categoryId;
      document.querySelectorAll('.category-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.category === categoryId);
      });
      loadProducts();
    }

    function createProductCard(p) {
      const imgSrc = p.image || 'https://placehold.co/400x300/e2e8f0/64748b?text=No+Image';
      return `
        <div class="product-card">
          <img src="${escapeAttr(imgSrc)}" alt="${escapeAttr(p.name)}" class="product-card-image"
               onerror="this.src='https://placehold.co/400x300/e2e8f0/64748b?text=No+Image'">
          <div class="product-card-body">
            <span class="product-card-category">${escapeHtml(p.category_name || 'Uncategorized')}</span>
            <h3 class="product-card-name">${escapeHtml(p.name)}</h3>
            <p class="product-card-desc">${escapeHtml(p.description || '')}</p>
            <div class="product-card-footer">
              <span class="product-card-price">$${Number(p.price).toFixed(2)}</span>
              <button class="btn btn-primary btn-sm add-to-cart-btn"
                      data-id="${p.id}"
                      data-name="${escapeAttr(p.name)}"
                      data-price="${p.price}"
                      data-image="${escapeAttr(p.image || '')}">
                Add to Cart
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Event delegation for add-to-cart buttons
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.add-to-cart-btn');
      if (btn) {
        cart.addItem({
          id: Number(btn.dataset.id),
          name: btn.dataset.name,
          price: Number(btn.dataset.price),
          image: btn.dataset.image,
        });
      }
    });

    function escapeAttr(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
