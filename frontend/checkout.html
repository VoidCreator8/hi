<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        ShopHub
      </a>
      <button class="mobile-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">&#9776;</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html" class="cart-link">Cart <span class="cart-count" style="display:none">0</span></a></li>
        <li><a href="admin-login.html">Admin</a></li>
      </ul>
    </div>
  </nav>

  <!-- Checkout Content -->
  <section class="checkout-page">
    <div class="container">
      <h2 class="section-title">Checkout</h2>
      <div id="checkout-content"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 ShopHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCheckout);

    function renderCheckout() {
      const container = document.getElementById('checkout-content');
      const items = cart.getItems();

      if (items.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <h2>Nothing to checkout</h2>
            <p style="color:var(--gray); margin-bottom:1.5rem;">Add some items to your cart first.</p>
            <a href="shop.html" class="btn btn-primary">Browse Products</a>
          </div>
        `;
        return;
      }

      const total = cart.getTotal();

      container.innerHTML = `
        <div class="checkout-grid">
          <form class="checkout-form" id="checkout-form" onsubmit="handleCheckout(event)">
            <h3 style="margin-bottom:1.5rem; font-size:1.125rem;">Shipping Information</h3>
            <div class="form-row">
              <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" required placeholder="John">
              </div>
              <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" required placeholder="Doe">
              </div>
            </div>
            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" id="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
            </div>
            <div class="form-group">
              <label for="address">Address *</label>
              <input type="text" id="address" required placeholder="123 Main Street">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="city">City *</label>
                <input type="text" id="city" required placeholder="New York">
              </div>
              <div class="form-group">
                <label for="zip">Zip Code *</label>
                <input type="text" id="zip" required placeholder="10001">
              </div>
            </div>
            <div class="form-group">
              <label for="country">Country *</label>
              <select id="country" required>
                <option value="">Select country</option>
                <option value="US">United States</option>
                <option value="CA">Canada</option>
                <option value="GB">United Kingdom</option>
                <option value="DE">Germany</option>
                <option value="FR">France</option>
                <option value="AU">Australia</option>
                <option value="OTHER">Other</option>
              </select>
            </div>

            <h3 style="margin: 1.5rem 0 1rem; font-size:1.125rem;">Payment (Demo)</h3>
            <div class="form-group">
              <label for="cardNumber">Card Number</label>
              <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242" maxlength="19">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="expiry">Expiry</label>
                <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
              </div>
              <div class="form-group">
                <label for="cvc">CVC</label>
                <input type="text" id="cvc" placeholder="123" maxlength="4">
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content:center; margin-top:1rem;">
              Place Order - $${total.toFixed(2)}
            </button>
          </form>

          <div class="order-summary">
            <h3>Order Summary</h3>
            ${items.map(item => `
              <div class="order-item">
                <span class="order-item-name">${escapeHtml(item.name)} x${item.quantity}</span>
                <span>$${(item.price * item.quantity).toFixed(2)}</span>
              </div>
            `).join('')}
            <div class="order-item" style="border-top:2px solid var(--gray-light); padding-top:0.75rem; margin-top:0.75rem; font-weight:700; font-size:1.125rem;">
              <span>Total</span>
              <span>$${total.toFixed(2)}</span>
            </div>
          </div>
        </div>
      `;
    }

    function handleCheckout(e) {
      e.preventDefault();
      const form = document.getElementById('checkout-form');
      const firstName = document.getElementById('firstName').value;

      // Simulate order placement
      cart.clear();
      document.getElementById('checkout-content').innerHTML = `
        <div class="cart-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" style="width:80px;height:80px;margin-bottom:1rem;">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <h2 style="color:var(--success);">Order Placed!</h2>
          <p style="color:var(--gray); margin-bottom:1.5rem;">Thank you, ${escapeHtml(firstName)}! Your order has been received. This is a demo store, so no actual payment was processed.</p>
          <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
