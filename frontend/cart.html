<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - ShopHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        ShopHub
      </a>
      <button class="mobile-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">&#9776;</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html" class="active cart-link">Cart <span class="cart-count" style="display:none">0</span></a></li>
        <li><a href="admin-login.html">Admin</a></li>
      </ul>
    </div>
  </nav>

  <!-- Cart Content -->
  <section class="cart-page">
    <div class="container">
      <h2 class="section-title">Shopping Cart</h2>
      <div id="cart-content"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 ShopHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCart);

    function renderCart() {
      const container = document.getElementById('cart-content');
      const items = cart.getItems();

      if (items.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
            </svg>
            <h2>Your cart is empty</h2>
            <p style="color:var(--gray); margin-bottom:1.5rem;">Looks like you haven't added anything yet.</p>
            <a href="shop.html" class="btn btn-primary">Browse Products</a>
          </div>
        `;
        return;
      }

      const total = cart.getTotal();

      container.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${items.map(item => `
              <tr>
                <td>
                  <div class="cart-item-info">
                    <img src="${escapeAttr(item.image || 'https://placehold.co/60x60/e2e8f0/64748b?text=N/A')}" alt="${escapeAttr(item.name)}" class="cart-item-img"
                         onerror="this.src='https://placehold.co/60x60/e2e8f0/64748b?text=N/A'">
                    <span class="cart-item-name">${escapeHtml(item.name)}</span>
                  </div>
                </td>
                <td>$${Number(item.price).toFixed(2)}</td>
                <td>
                  <div class="qty-control">
                    <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity - 1})">-</button>
                    <span class="qty-value">${item.quantity}</span>
                    <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
                  </div>
                </td>
                <td><strong>$${(item.price * item.quantity).toFixed(2)}</strong></td>
                <td>
                  <button class="remove-btn" onclick="removeItem(${item.id})" title="Remove">&times;</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="cart-summary">
          <div class="cart-summary-box">
            <div class="cart-summary-row">
              <span>Subtotal</span>
              <span>$${total.toFixed(2)}</span>
            </div>
            <div class="cart-summary-row">
              <span>Shipping</span>
              <span style="color:var(--success);">Free</span>
            </div>
            <div class="cart-summary-row cart-summary-total">
              <span>Total</span>
              <span>$${total.toFixed(2)}</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-lg" style="width:100%; justify-content:center; margin-top:1rem;">
              Proceed to Checkout
            </a>
          </div>
        </div>
      `;
    }

    function updateQty(productId, newQty) {
      if (newQty < 1) {
        removeItem(productId);
        return;
      }
      cart.updateQuantity(productId, newQty);
      renderCart();
    }

    function removeItem(productId) {
      cart.removeItem(productId);
      renderCart();
      showToast('Item removed from cart');
    }

    function escapeAttr(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
